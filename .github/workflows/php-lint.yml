name: PHP syntax check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          php --version
          find snippets -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l
